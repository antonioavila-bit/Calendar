name: Offline Calendar APK

on:
  push:
    branches: ["security/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'antonioavila-bit/Calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build preview and scheduling unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFossDebug :app:testFossDebugUnitTest :app:assembleFossDebugAndroidTest
      - name: Verify actual APK identity, signature and offline permissions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          APK=$(find app/build/outputs/apk/foss/debug -name '*.apk' -print -quit)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > deliverables/apk-signature.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > deliverables/apk-badging.txt
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" > deliverables/apk-permissions.txt
          "$BUILD_TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > deliverables/apk-manifest.txt
          grep -q "com.antonioavila.offlinesecuritycalendar.debug" deliverables/apk-badging.txt
          grep -q "org.fossify.calendar.security.ShiftActivity" deliverables/apk-badging.txt
          if grep -Eq 'android.permission.(INTERNET|READ_CALENDAR|WRITE_CALENDAR|READ_CONTACTS|MANAGE_EXTERNAL_STORAGE)' deliverables/apk-permissions.txt; then
            echo 'Unexpected network/calendar/contact/storage permission in installed APK'; exit 1
          fi
          python3 scripts/check_preview_artifact.py "$APK"
          cp "$APK" deliverables/Shift-Calendar-0.1.0-preview02.apk
          git rev-parse HEAD > deliverables/commit.txt
          git archive --format=zip --output=deliverables/shift-calendar-source.zip HEAD
          cp docs/INSTALL_PREVIEW.md deliverables/INSTALL_PREVIEW.txt
          cd deliverables
          sha256sum Shift-Calendar-0.1.0-preview02.apk shift-calendar-source.zip > SHA256SUMS.txt
      - name: Save signed preview, source and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Shift-Calendar-preview-APK-${{ github.run_number }}
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Save instrumented test APKs
        uses: actions/upload-artifact@v4
        with:
          name: shift-test-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/apk/androidTest/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
  device-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: shift-test-apks-${{ github.run_number }}
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Airplane-mode device storage, backup and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run_preview_device_tests.sh ${{ matrix.api }}
      - name: Device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-device-evidence-api${{ matrix.api }}-${{ github.run_number }}
          path: device-evidence/
          if-no-files-found: warn
