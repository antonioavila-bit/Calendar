name: Offline Calendar APK

on:
  push:
    branches: ["security/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'antonioavila-bit/Calendar'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          mkdir -p deliverables
          git archive --format=zip --output=deliverables/calendar-source.zip HEAD
          git rev-parse HEAD > deliverables/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-source-${{ github.run_number }}
          path: deliverables/
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleFossDebug :app:testFossDebugUnitTest
      - name: Collect build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
      - name: Collect baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-engine-baseline-not-shift-release-${{ github.run_number }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 30
